# BEGIN Larco Eye Clinic — rendimiento y seguridad
# Copia de referencia del bloque que va en public_html/.htaccess del hosting
# (debajo de los bloques que genera cPanel). No se publica con build.py.
# Si cambia el <script> en línea de _partials/header.html, hay que recalcular
# su hash sha256 en la Content-Security-Policy.

# Sin listados de carpetas.
Options -Indexes

# Siempre por https y sin "www".
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTPS} !=on [OR]
  RewriteCond %{HTTP_HOST} ^www\. [NC]
  RewriteRule ^ https://larcoeyeclinic.com%{REQUEST_URI} [L,R=301]
</IfModule>

# Archivos internos que nunca deben verse desde Internet.
<FilesMatch "(^\.|\.(bak|ini|log|md|py|conf|sql|sh|env|json|lock|dist)$|~$)">
  Require all denied
</FilesMatch>

# Cabeceras de seguridad.
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lIS7tW80nyC/O0YtOtbg5uFh5tUIjhtclXofEO90P1c='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
  Header always unset X-Powered-By
  Header unset X-Powered-By
</IfModule>

# Compresión de texto (HTML, CSS, JS, SVG, JSON, XML).
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript text/javascript application/json image/svg+xml application/xml
</IfModule>

# Caché en el navegador. CSS y JS llevan ?v=NNN en cada página, así que un
# cambio se ve al instante aunque estén guardados un año.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresDefault "access plus 1 week"
  ExpiresByType text/html "access plus 0 seconds"
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  ExpiresByType text/javascript "access plus 1 year"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType image/svg+xml "access plus 1 month"
  ExpiresByType image/webp "access plus 1 month"
  ExpiresByType image/jpeg "access plus 1 month"
  ExpiresByType image/png "access plus 1 month"
  ExpiresByType video/mp4 "access plus 1 month"
</IfModule>
<IfModule mod_headers.c>
  <FilesMatch "\.(html|php)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  <FilesMatch "\.(css|js|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
</IfModule>
AddType font/woff2 .woff2
AddType image/webp .webp
# END Larco Eye Clinic — rendimiento y seguridad
